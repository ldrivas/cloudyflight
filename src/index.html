<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Cloudy Flight User Profile</title>

  <!-- Bootstrap 4 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    crossorigin="anonymous"
  />

  <!-- Font Awesome Free -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Toyhou global + Tooltipster (optional) -->
  <link rel="stylesheet" href="https://toyhou.se/css/global.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/tooltipster/4.2.8/css/tooltipster.bundle.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>

  <!-- image background -->
  <div style="
    background: #d16679 url('img/clouds.jpg') no-repeat center center fixed;
    background-size: cover;
    width: 100%; height: 100%;
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    z-index: -10;
"></div>
  <!-- END image background -->

  <!-- full container -->
  <div class="my-5 mx-auto" style="max-width: 600px;">

    <!-- username title row -->
    <div class="row no-gutters pl-2 rounded"
         style="
           color: #ffffff;
           letter-spacing: 3px;
           font-weight: 500;
           font-size: 30px;
           text-shadow:
             -2px -1px 0 #d16679,
              1px -1px 0 #d16679,
             -1px  1px 0 #d16679,
              1px  1px 0 #d16679,
             -1px  2px 0 #d16679,
             -2px  2px 0 #d16679;
           background: linear-gradient(
             to left,
             rgba(0,0,0,0),
             rgba(0,0,0,.6)
           );
         ">
      <!-- text -->
      <div class="mr-3 ml-1">99 CENTS AND A DREAM...</div> &nbsp;&nbsp;

      <!-- static arrow pointer (free) -->
      <div style="position: relative; left:11px; top:12px; z-index:10;">
        <i class="fas fa-arrow-pointer"></i>
      </div>

      <!-- free spinner -->
      <div style="position: relative; right:25px; text-shadow:none;">
        <i class="fas fa-spinner fa-spin"></i>
      </div>
    </div>
    <!-- END username title row -->

    <!-- container around content below title -->
    <div class="px-1">

      <!-- socials box -->
      <div class="my-3 rounded"
           style="
             border:1px solid #000000;
             background-color:#ffffff;
             color:#000000;
             box-shadow:-4px 4px 0 0 rgba(0,0,0,.3);
           ">
        <!-- title bar -->
        <div class="p-1 row no-gutters rounded-top"
             style="
               border-bottom:1px solid #000000;
               background-color:#f5e4e6;
               font-weight:600;
             ">
          <div class="mx-auto d-flex justify-content-start col-auto">
            <div class="mx-1" style="letter-spacing:1.5px;">
              <i class="fas fa-link mr-1"></i>SOCIALS
            </div>
          </div>
          <div class="mx-auto d-flex justify-content-end col">
            <div class="mx-1"><i class="fas fa-minus"></i></div>
            <div class="mx-1"><i class="fas fa-clone"></i></div>
            <div class="mx-1"><i class="fas fa-times"></i></div>
          </div>
        </div>
        <!-- END title bar -->

        <!-- socials buttons -->
        <div class="px-1 pb-2 text-center" style="font-size:16px;">
          <div class="d-inline-block px-2 p-1 rounded mt-2"
               style="background-color:#d16679;color:#ffffff;">
            <a href="LINK_HERE" class="text-reset">
              <i class="fas fa-user"></i> LINK_NAME
            </a>
          </div>
          <div class="d-inline-block px-2 p-1 rounded mt-2 ml-1"
               style="background-color:#d16679;color:#ffffff;">
            <a href="LINK_HERE" class="text-reset">
              <i class="fab fa-twitter"></i> LINK_NAME
            </a>
          </div>
          <div class="d-inline-block px-2 p-1 rounded mt-2 ml-1"
               style="background-color:#d16679;color:#ffffff;">
            <a href="LINK_HERE" class="text-reset">
              <i class="fas fa-paint-brush"></i> LINK_NAME
            </a>
          </div>
          <div class="d-inline-block px-2 p-1 rounded mt-2 ml-1"
               style="background-color:#d16679;color:#ffffff;">
            <a href="LINK_HERE" class="text-reset">
              <i class="fas fa-globe"></i> LINK_NAME
            </a>
          </div>
        </div>
        <!-- END socials buttons -->
      </div>
      <!-- END socials box -->

      <!-- art status & pagedoll row -->
      <div class="row no-gutters">

        <!-- art status column -->
        <div class="pr-lg-1 col-lg-6 mb-2 d-flex flex-column">
          <div class="rounded"
               style="
                 border:1px solid #000000;
                 background-color:#ffffff;
                 color:#000000;
                 box-shadow:-4px 4px 0 0 rgba(0,0,0,.3);
               ">
            <!-- title bar -->
            <div class="p-1 row no-gutters rounded-top"
                 style="
                   border-bottom:1px solid #000000;
                   background-color:#f5e4e6;
                   font-weight:600;
                 ">
              <div class="mx-auto d-flex justify-content-start col-auto">
                <div class="mx-1" style="letter-spacing:1.5px;">
                  <i class="fas fa-paint-brush mr-1"></i>ART STATUS
                </div>
              </div>
              <div class="mx-auto d-flex justify-content-end col">
                <div class="mx-1"><i class="fas fa-minus"></i></div>
                <div class="mx-1"><i class="fas fa-clone"></i></div>
                <div class="mx-1"><i class="fas fa-times"></i></div>
              </div>
            </div>
            <!-- END title bar -->

            <!-- art status entries -->
            <div class="p-1">
              <div class="row no-gutters px-2">
                <div class="col-auto pt-1 small font-weight-bold text-uppercase mt-1"
                     style="color:#d16679; letter-spacing:1.5px;">
                  commissions
                </div>
                <div class="col p-1 my-1" style="margin-top:5px;">
                  <hr class="m-2" style="background:rgba(0,0,0,.4);"/>
                </div>
                <div class="col-auto py-1">
                  status on
                  <a href="LINK_HERE" target="_blank" style="color:#d16679;">here</a>
                </div>
              </div>
              <div class="row no-gutters px-2">
                <div class="col-auto pt-1 small font-weight-bold text-uppercase mt-1"
                     style="color:#d16679; letter-spacing:1.5px;">
                  art trades
                </div>
                <div class="col p-1 my-1" style="margin-top:5px;">
                  <hr class="m-2" style="background:rgba(0,0,0,.4);"/>
                </div>
                <div class="col-auto py-1">ask</div>
              </div>
              <div class="row no-gutters px-2">
                <div class="col-auto pt-1 small font-weight-bold text-uppercase mt-1"
                     style="color:#d16679; letter-spacing:1.5px;">
                  requests
                </div>
                <div class="col p-1 my-1" style="margin-top:5px;">
                  <hr class="m-2" style="background:rgba(0,0,0,.4);"/>
                </div>
                <div class="col-auto py-1">closed</div>
              </div>
            </div>
            <!-- END art status entries -->
          </div>
        </div>
        <!-- END art status column -->

        <!-- pagedoll column -->
        <div class="pl-lg-1 col-lg-6 d-flex justify-content-center">
          <a href="home.html">
            <img
              alt="pagedoll"
              src='img\gif1.gif'
              style="user-drag:none;-webkit-user-drag:none;user-select:none;max-height:300px;"
            />
          </a>
        </div>
        <!-- END pagedoll column -->

      </div>
      <!-- END art status & pagedoll row -->

      <!-- featured character & folders row -->
      <div class="row no-gutters">

        <!-- featured character column -->
        <div class="pl-lg-1 col-lg-6 justify-content-center my-3">
          <div>
            <!-- speech box -->
            <div class="p-2 px-3 rounded mr-lg-3 mb-4 d-inline-block"
                 style="
                   background-color:#d16679;
                   color:#ffffff;
                   box-shadow:-4px 4px 0 0 rgba(0,0,0,.3);
                   border:3px solid #ffffff;
                 ">
              THE FAVORITE CHILD <i class="fas fa-heart ml-1"></i>
              <div style="position:relative;">
                <div style="position:absolute; top:-10px;">
                  <i class="fas fa-caret-right"
                     style="
                       color:#d16679;
                       font-size:45px;
                       text-shadow:-2.5px 3px #ffffff,
                                   -2px 5px #ffffff,
                                   -7px 4px rgba(0,0,0,.3);
                       transform:rotate(-45deg);
                     "></i>
                </div>
              </div>
            </div>
            <!-- END speech box -->

            <!-- character image -->
            <div class="justify-content-center mr-3" style="position:relative; z-index:10;">
              <a href="LINK_HERE" class="tooltipster" target="_blank">
                <img
                  alt="featured chara"
                  src="img\character1.png"
                  class="rounded-circle p-1"
                  style="user-drag:none;-webkit-user-drag:none;user-select:none;object-fit:cover;object-position:center;height:150px;width:150px;background-color:#ffffff;"
                />
              </a>
            </div>
            <!-- END character image -->
          </div>
        </div>
        <!-- END featured character column -->

        <!-- folders column -->
        <div class="pr-lg-1 col-lg-6 mb-2 d-flex flex-column">
          <div class="rounded mb-3 mt-2"
               style="
                 border:1px solid #000000;
                 background-color:#ffffff;
                 color:#000000;
                 box-shadow:-4px 4px 0 0 rgba(0,0,0,.3);
               ">
            <!-- title bar -->
            <div class="p-1 row no-gutters rounded-top"
                 style="
                   border-bottom:1px solid #000000;
                   background-color:#f5e4e6;
                   font-weight:600;
                 ">
              <div class="mx-auto d-flex justify-content-start col-auto">
                <div class="mx-1" style="letter-spacing:1.5px;">
                  <i class="fas fa-folder mr-1"></i>FOLDERS
                </div>
              </div>
              <div class="mx-auto d-flex justify-content-end col">
                <div class="mx-1"><i class="fas fa-minus"></i></div>
                <div class="mx-1"><i class="fas fa-clone"></i></div>
                <div class="mx-1"><i class="fas fa-times"></i></div>
              </div>
            </div>
            <!-- END title bar -->

            <!-- folders list -->
            <div class="px-2 pt-2 text-center">
              <a href="LINK_HERE" class="rounded d-block p-2 mb-2" style="background-color:#d16679;color:#ffffff;">
                <i class="fas fa-dollar-sign fa-fw"></i> SALE/TRADE
              </a>
              <a href="LINK_HERE" class="rounded d-block p-2 mb-2" style="background-color:#d16679;color:#ffffff;">
                <i class="fas fa-users fa-fw"></i> CHARACTERS
              </a>
              <a href="LINK_HERE" class="rounded d-block p-2 mb-2" style="background-color:#d16679;color:#ffffff;">
                <i class="fas fa-code fa-fw"></i> HTML CODES
              </a>
            </div>
            <!-- END folders list -->
          </div>

          <!-- credits -->
          <div class="justify-content-center">
            <div class="d-inline-block px-1 rounded"
                 style="
                   border:1px solid #000000;
                   background-color:#ffffff;
                   color:#000000;
                   box-shadow:-4px 4px 0 0 rgba(0,0,0,.3);
                 ">
              <a class="tooltipster text-reset" href="LINK_HERE" target="_blank" title="art by yappari"><i class="fas fa-paint-brush fa-fw"></i></a>
              <a class="tooltipster text-reset ml-1" href="LINK_HERE" target="_blank" title="code by teiyoq"><i class="fas fa-feather fa-fw"></i></a>
            </div>
          </div>
          <!-- END credits -->
        </div>
        <!-- END folders column -->

      </div>
      <!-- END featured character & folders row -->

    </div>
    <!-- END container around content below title -->

  </div>
  <!-- END full container -->

  <!-- JS dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tooltipster/4.2.8/js/tooltipster.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>$(document).ready(function(){$('.tooltipster').tooltipster();});</script>
</body>
</html>
